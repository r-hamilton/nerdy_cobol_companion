let pdf=null, viewPage=null, renderTask=null, zoomScale=1;
const IDB_NAME="cobol-companion", IDB_STORE="manual";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(){ try{ const db=await idb(); return await new Promise((res)=>{ const q=db.transaction(IDB_STORE).objectStore(IDB_STORE).get("pdf"); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbPut(buf){ try{ const db=await idb(); await new Promise((res)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(buf,"pdf"); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }

function stepSlide(){ const s=BY[S.cur]; return s.slide || s.ref || null; }
function renderStage(){
  renderDiag();
  const stage=$("stage"), s=BY[S.cur];
  $("vBack").hidden = !(viewPage && viewPage!==stepSlide());
  if(!pdf){
    $("vTitle").textContent = s.slide ? `Manual slide ${s.slide}` : "Manual";
    stage.innerHTML = `<div class="drop" id="drop"><h4>Load your copy of the manual</h4><p>The slides show here next to each step. Download the v2.0.0 PDF from Nerdy Gurdy, then drop it on this box or choose it. It stays in this browser, so you only do this once per device.</p><code>${esc(MANUAL_URL)}</code><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${MANUAL_URL}" target="_blank" rel="noopener">Open the PDF on nerdygurdy.nl</a><button type="button" class="btn pri" id="pick">Choose the PDF</button></div></div>`;
    $("pick").onclick=()=>$("fileIn").click();
    wireDrop($("drop"));
    return;
  }
  const page = viewPage || stepSlide();
  if(!page){
    $("vTitle").textContent = "No manual slide for this step";
    stage.innerHTML = `<div class="noslide"><h4>Added step</h4><p>This step is part of your burst finish plan and has no slide in the manual. Use the arrows to browse the manual if you need it.</p><div class="burst" aria-hidden="true"></div></div>`;
    return;
  }
  const isRef = !s.slide && page===s.ref && !viewPage;
  $("vTitle").textContent = `Manual slide ${page} of ${pdf.numPages}` + (isRef?" \u00B7 reference":"");
  if(!stage.querySelector("#cv")){
    stage.innerHTML = `<div class="canvaswrap" id="cw" title="Click to zoom"><canvas id="cv"></canvas></div><div class="peeknote" id="peek"></div>`;
    $("cw").onclick=openZoom;
  }
  $("peek").textContent = viewPage && viewPage!==stepSlide() ? "Browsing the manual. Your step hasn't changed." : (isRef?"Reference slide for this added step.":"");
  drawPage(page, $("cv"), $("cw").clientWidth);
}
async function drawPage(n, canvas, cssW, scaleMult){
  if(!pdf || !canvas) return;
  try{
    const page = await pdf.getPage(n);
    const base = page.getViewport({scale:1});
    const dpr = Math.min(window.devicePixelRatio||1, 2.5);
    const scale = (cssW/base.width) * (scaleMult||1);
    const vp = page.getViewport({scale: scale*dpr});
    if(canvas===$("cv") && renderTask){ try{ renderTask.cancel(); }catch(e){} }
    canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
    if(scaleMult){ canvas.style.width = Math.floor(vp.width/dpr)+"px"; canvas.style.height = Math.floor(vp.height/dpr)+"px"; }
    const task = page.render({canvasContext: canvas.getContext("2d"), viewport: vp});
    if(canvas===$("cv")) renderTask = task;
    await task.promise;
  }catch(e){ if(e && e.name==="RenderingCancelledException") return; }
}
function showSlide(n, peek){
  if(!pdf){ renderStage(); return; }
  n = Math.max(1, Math.min(pdf.numPages, n));
  viewPage = (n===stepSlide()) ? null : n;
  renderStage();
  $("viewer").scrollTop = 0;
}
function showStepSlide(){ viewPage=null; renderStage(); }
$("vPrev").onclick=()=>{ const p=viewPage||stepSlide()||9; showSlide(p-1,true); };
$("vNext").onclick=()=>{ const p=viewPage||stepSlide()||8; showSlide(p+1,true); };
$("vBack").onclick=showStepSlide;
$("vZoom").onclick=()=>openZoom();
let roT=null;
new ResizeObserver(()=>{ clearTimeout(roT); roT=setTimeout(()=>{ if(pdf && $("cv")) drawPage(viewPage||stepSlide(), $("cv"), $("cw").clientWidth); },120); }).observe($("viewer"));

function openZoom(){
  const p = viewPage||stepSlide(); if(!pdf || !p) return;
  zoomScale = 1; $("zoom").hidden=false; drawZoom(); $("zClose").focus();
}
function drawZoom(){ const p = viewPage||stepSlide(); const w = $("zScroll").clientWidth - 8; drawPage(p, $("zCanvas"), w, zoomScale); }
$("zClose").onclick=()=>{ $("zoom").hidden=true; };
$("zIn").onclick=()=>{ zoomScale=Math.min(3,zoomScale*1.35); drawZoom(); };
$("zOut").onclick=()=>{ zoomScale=Math.max(.6,zoomScale/1.35); drawZoom(); };
(function dragPan(){ const sc=$("zScroll"); let d=null; sc.addEventListener("pointerdown",e=>{ d={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop}; sc.setPointerCapture(e.pointerId); sc.style.cursor="grabbing"; }); sc.addEventListener("pointermove",e=>{ if(!d) return; sc.scrollLeft=d.l-(e.clientX-d.x); sc.scrollTop=d.t-(e.clientY-d.y); }); const up=()=>{ d=null; sc.style.cursor=""; }; sc.addEventListener("pointerup",up); sc.addEventListener("pointercancel",up); })();

function wireDrop(el){
  ["dragenter","dragover"].forEach(ev=>el.addEventListener(ev,e=>{ e.preventDefault(); el.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=>el.addEventListener(ev,e=>{ e.preventDefault(); el.classList.remove("over"); }));
  el.addEventListener("drop", e=>{ const f=e.dataTransfer && e.dataTransfer.files[0]; if(f) loadFile(f); });
}
$("btnLoad").onclick=()=>$("fileIn").click();
$("fileIn").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) loadFile(f); e.target.value=""; });
async function loadFile(f){
  if(!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)){ toast("That file isn't a PDF. Choose the Cobol manual PDF."); return; }
  const buf = await f.arrayBuffer();
  const ok = await openPdf(buf.slice(0));
  if(ok){ idbPut(buf); }
}
async function openPdf(buf){
  if(!window.pdfjsLib){ toast("The PDF viewer couldn't load. Check your connection and reload."); return false; }
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
    $("btnLoad").textContent = "Replace manual";
    if(pdf.numPages!==86) toast(`This PDF has ${pdf.numPages} slides. The steps follow v2.0.0 (86 slides), so slide numbers may not match.`);
    viewPage=null; renderStage(); return true;
  }catch(e){ pdf=null; toast("That PDF couldn't be opened. Try downloading the manual again."); renderStage(); return false; }
}

/* ---------------- corrections drawer ---------------- */
$("finSel").addEventListener("change", e=>setFinish(e.target.value));
syncFinSel();
$("btnNotes").onclick=()=>{
  const d=$("drawer");
  if(!d.hidden){ d.hidden=true; return; }
  d.innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><h3>Manual corrections</h3><button type="button" class="btn" id="dClose">Close</button></div><p class="sub">Small issues found in the v2.0.0 manual, and the one place this guide deliberately departs from it.</p><ol>${ERRATA.map(([w,t])=>`<li><div class="mono">${esc(w)}</div>${esc(t)}</li>`).join("")}</ol>`;
  d.hidden=false; $("dClose").onclick=()=>{ d.hidden=true; }; $("dClose").focus();
};

/* ---------------- wake lock ---------------- */
let wake=null, wantWake=false;
async function getWake(){ try{ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{ wake=null; }); return true; }catch(e){ return false; } }
$("btnWake").onclick=async()=>{
  unlockAudio();
  if(wantWake){ wantWake=false; try{ wake && await wake.release(); }catch(e){} $("btnWake").classList.remove("on"); $("btnWake").textContent="Keep screen on"; return; }
  if(!("wakeLock" in navigator)){ toast("This browser can't keep the screen awake. Change your laptop's sleep setting instead."); return; }
  const ok = await getWake();
  if(ok){ wantWake=true; $("btnWake").classList.add("on"); $("btnWake").textContent="Screen stays on"; }
  else toast("The screen-awake request was refused here. Change your laptop's sleep setting instead.");
};
document.addEventListener("visibilitychange",()=>{ if(wantWake && !wake && document.visibilityState==="visible") getWake(); });

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e=>{
  if(e.target.closest && e.target.closest("textarea,input")) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="Escape"){ if(!$("zoom").hidden){ $("zoom").hidden=true; } else if(!$("drawer").hidden){ $("drawer").hidden=true; } return; }
  if(!$("zoom").hidden) return;
  const s=BY[S.cur];
  if(e.key==="ArrowRight" && s.i<N-1){ e.preventDefault(); go(ORDER[s.i+1]); }
  else if(e.key==="ArrowLeft" && s.i>0){ e.preventDefault(); go(ORDER[s.i-1]); }
  else if(e.key==="d"||e.key==="D"){ unlockAudio(); if(!isDone(s.id)) markDone(s, !!s.timer); }
  else if(e.key==="s"||e.key==="S"){ if(!isDone(s.id) && !isLater(s.id)) skipLater(s); }
  else if(e.key==="z"||e.key==="Z"){ openZoom(); }
});
document.addEventListener("pointerdown", unlockAudio, {once:true});

/* ---------------- boot ---------------- */
setSync("local");
renderAll(); renderStage();
setInterval(tick, 1000);
(async()=>{ const buf = await idbGet(); if(buf) openPdf(buf.slice ? buf.slice(0) : buf); })();
initRemote();
</script>
